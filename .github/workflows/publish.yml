name: Build & Test

on: [push, pull_request]

permissions:
  packages: write
  contents: read

jobs:
  build_tag:
    if: startsWith(github.event.ref, 'refs/tags/')
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-client:${{github.ref_name}}
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
  
  build_branch:
    if: ${{ (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push' }}
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-client:${{ github.head_ref || github.ref_name }} 
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
